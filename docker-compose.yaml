services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: twitter_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - net

  backend:
    build: ./backend
    container_name: backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/twitter_clone
    depends_on:
      - postgres
    expose:
      - "5000"
    volumes:
      - ./backend/static/uploads:/app/static/uploads
    restart: unless-stopped
    networks:
      - net

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - net

volumes:
  postgres_data:

networks:
  net:
    driver: bridge